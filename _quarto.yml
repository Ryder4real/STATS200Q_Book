project:
  type: book
  output-dir: docs

engine: knitr

filters:
  - webr

book:
  chapters:
    - index.qmd
    - Week1.qmd
    - Week2.qmd
    - Week3.qmd
    - Week4.qmd
    - Week5.qmd
    - Week6.qmd
    - Week7.qmd
    - Week8.qmd
    - Week9.qmd
    - references.qmd

bibliography: references.bib

# CRITICAL FIX: Tell Quarto's citation processor to only output a global bibliography
citeproc: true

execute:
  freeze: false
  cache: false

format:
  html:
    theme: cosmo
    # This option forces page citations into the margin or hides them if a global bib exists
    reference-location: margin
  pdf:
    toc: true
    number-sections: true
    colorlinks: true
    knitr:
      opts_chunk:
        dev: "pdf" # Fixed the trailing "?" syntax error here
