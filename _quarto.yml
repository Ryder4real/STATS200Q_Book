project:
  type: book
  output-dir: docs

engine: knitr

filters:
  - webr

book:
  title: "Stats200Q Book"
  author: "Ryder Fried"
  date: "6/8/2026"

  chapters:
    - index.qmd
    - Week1.qmd
    - Week2.qmd
    - Week3.qmd
    - Week4.qmd
    - Week5.qmd
    - Week6.qmd
    - Week7.qmd
    - Week8.qmd
    - Week9.qmd
    - references.qmd

bibliography: references.bib

# Moving filters to the top level tells Quarto how to parse
# {webr-r} blocks globally, even when building non-HTML formats

execute:
  freeze: false
  cache: false

format:
  html:
    theme: cosmo
  pdf:
    toc: true
    number-sections: true
    colorlinks: true
    knitr:
      opts_chunk:
        dev: "pdf"
